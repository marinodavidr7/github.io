<svg viewBox="0 0 540 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" floodColor="#000000" floodOpacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- Crossed Oars -->
    <g id="crossed-oars">
      <line x1="45" y1="20" x2="120" y2="130" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
      <path d="M 32 36 C 25 24 38 12 50 20 C 62 28 54 44 42 46 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />
      <line x1="120" y1="20" x2="45" y2="130" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
      <path d="M 133 36 C 140 24 127 12 115 20 C 103 28 111 44 123 46 Z" fill="#ffffff" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" />

      <line x1="45" y1="20" x2="120" y2="130" stroke="#653316" stroke-width="8" stroke-linecap="round" />
      <path d="M 32 36 C 25 24 38 12 50 20 C 62 28 54 44 42 46 Z" fill="#653316" />
      <line x1="120" y1="20" x2="45" y2="130" stroke="#53270f" stroke-width="8" stroke-linecap="round" />
      <path d="M 133 36 C 140 24 127 12 115 20 C 103 28 111 44 123 46 Z" fill="#53270f" />
    </g>

    <!-- Center REMO Text -->
    <g id="remo-wordmark" transform="translate(130, 0)">
      <text x="0" y="96" font-family="'Arial Black', 'Impact', sans-serif" font-size="98" font-weight="900" font-style="italic" letter-spacing="-2" fill="#f01a75" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" paint-order="stroke fill">
        REMO
      </text>
      <text x="2" y="126" font-family="'Arial Black', 'Impact', sans-serif" font-size="21" font-weight="900" letter-spacing="1.2" fill="#00a84f" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke fill">
        RESTAURANTE ALTA COCINA
      </text>
    </g>

    <!-- Right Ship Wheel -->
    <g id="ship-wheel" transform="translate(440, 72)">
      <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" fill="none">
        <circle cx="0" cy="0" r="40" />
        <circle cx="0" cy="0" r="24" />
        <circle cx="0" cy="0" r="11" fill="#ffffff" />
        <line x1="0" y1="-56" x2="0" y2="56" />
        <line x1="-56" y1="0" x2="56" y2="0" />
        <line x1="-39.5" y1="-39.5" x2="39.5" y2="39.5" />
        <line x1="-39.5" y1="39.5" x2="39.5" y2="-39.5" />
      </g>

      <g stroke="#653316" stroke-width="8" stroke-linecap="round" fill="none">
        <circle cx="0" cy="0" r="40" />
        <circle cx="0" cy="0" r="24" stroke-width="6" />
        <circle cx="0" cy="0" r="11" fill="#653316" stroke-width="6" />
        <line x1="0" y1="-56" x2="0" y2="56" />
        <line x1="-56" y1="0" x2="56" y2="0" />
        <line x1="-39.5" y1="-39.5" x2="39.5" y2="39.5" />
        <line x1="-39.5" y1="39.5" x2="39.5" y2="-39.5" />
      </g>

      <g fill="#653316" stroke="#ffffff" stroke-width="2">
        <circle cx="0" cy="-56" r="4.5" />
        <circle cx="0" cy="56" r="4.5" />
        <circle cx="-56" cy="0" r="4.5" />
        <circle cx="56" cy="0" r="4.5" />
        <circle cx="-39.5" cy="-39.5" r="4.5" />
        <circle cx="39.5" cy="39.5" r="4.5" />
        <circle cx="-39.5" cy="39.5" r="4.5" />
        <circle cx="39.5" cy="-39.5" r="4.5" />
      </g>
      <circle cx="0" cy="0" r="5" fill="#f01a75" />
    </g>
  </g>
</svg>
